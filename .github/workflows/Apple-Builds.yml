name: "Apple Build & Release"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number'
        required: true
        default: '2111'

jobs:
  macos_build:
    name: macOS Build (Universal)
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'

      - name: Clone Repository
        run: git clone -b SpotifyCanva https://${{ secrets.SECRET_KEY }}@github.com/punisher-303/ECHOPULS.git

      - name: Install Dependencies
        run: cd ECHOPULS && flutter pub get

      - name: Extract version from pubspec.yaml
        id: extract_version
        run: |
          ver=$(grep -m1 -E '^version:\s*' ECHOPULS/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ -z "$ver" ]; then echo "version not found in pubspec.yaml"; exit 1; fi
          echo "VERSION=$ver" >> $GITHUB_ENV
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Set build number
        run: |
          BUILD_NUM="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then BUILD_NUM="2111"; fi
          echo "BUILDVERSION=$BUILD_NUM" >> $GITHUB_ENV

      - name: Configure macOS Entitlements
        run: |
          for f in ECHOPULS/macos/Runner/DebugProfile.entitlements ECHOPULS/macos/Runner/Release.entitlements; do
            /usr/libexec/PlistBuddy -c "Delete :com.apple.security.app-sandbox" "$f" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.app-sandbox bool false" "$f"
            /usr/libexec/PlistBuddy -c "Delete :com.apple.security.cs.allow-jit" "$f" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.cs.allow-jit bool true" "$f"
            /usr/libexec/PlistBuddy -c "Delete :com.apple.security.network.client" "$f" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "$f"
          done

      - name: Build macOS (Universal)
        run: |
          cd ECHOPULS
          flutter build macos --release --build-number ${{ env.BUILDVERSION }} --no-tree-shake-icons

      - name: Package macOS (Separate Architectures)
        run: |
          cd ECHOPULS/build/macos/Build/Products/Release
          APP_PATH=$(ls -d *.app | head -n 1)
          
          # Duplicate for thinning
          cp -R "$APP_PATH" "EchoPulse-ARM64.app"
          cp -R "$APP_PATH" "EchoPulse-Intel.app"
          
          # Thin to ARM64
          find "EchoPulse-ARM64.app" -type f | while read -r lib; do
            if file "$lib" | grep -q "Mach-O universal binary"; then
              lipo -thin arm64 "$lib" -output "$lib" || true
            fi
            if file "$lib" | grep -q "Mach-O"; then
              BAD_ZLIB=$(otool -L "$lib" 2>/dev/null | grep "/opt/homebrew/.*/libz.*\.dylib" | awk '{print $1}' || true)
              if [ ! -z "$BAD_ZLIB" ]; then
                for bad_path in $BAD_ZLIB; do
                  install_name_tool -change "$bad_path" "/usr/lib/libz.1.dylib" "$lib"
                done
              fi
            fi
          done
          
          # Thin to Intel (x86_64)
          find "EchoPulse-Intel.app" -type f | while read -r lib; do
            if file "$lib" | grep -q "Mach-O universal binary"; then
              lipo -thin x86_64 "$lib" -output "$lib" || true
            fi
            if file "$lib" | grep -q "Mach-O"; then
              BAD_ZLIB=$(otool -L "$lib" 2>/dev/null | grep "/opt/homebrew/.*/libz.*\.dylib" | awk '{print $1}' || true)
              if [ ! -z "$BAD_ZLIB" ]; then
                for bad_path in $BAD_ZLIB; do
                  install_name_tool -change "$bad_path" "/usr/lib/libz.1.dylib" "$lib"
                done
              fi
            fi
          done
          
          # Remove original universal app to avoid nesting during mv
          rm -rf "$APP_PATH"
          
          # Rename inner apps back to normal names for DMG so user sees EchoPulse.app
          mv "EchoPulse-ARM64.app" "EchoPulse.app"
          codesign --sign - --force --deep "EchoPulse.app"
          mkdir -p dmg_temp_arm64
          cp -R "EchoPulse.app" dmg_temp_arm64/
          ln -s /Applications dmg_temp_arm64/Applications
          hdiutil create -volname "EchoPulse" -srcfolder dmg_temp_arm64 -ov -format UDZO ../../../../../echo_pulse_macos_arm64_v${{ env.VERSION }}+${{ env.BUILDVERSION }}.dmg
          zip -ry ../../../../../echo_pulse_macos_arm64_v${{ env.VERSION }}+${{ env.BUILDVERSION }}.zip "EchoPulse.app"
          rm -rf "EchoPulse.app"

          mv "EchoPulse-Intel.app" "EchoPulse.app"
          codesign --sign - --force --deep "EchoPulse.app"
          mkdir -p dmg_temp_intel
          cp -R "EchoPulse.app" dmg_temp_intel/
          ln -s /Applications dmg_temp_intel/Applications
          hdiutil create -volname "EchoPulse" -srcfolder dmg_temp_intel -ov -format UDZO ../../../../../echo_pulse_macos_intel_v${{ env.VERSION }}+${{ env.BUILDVERSION }}.dmg
          zip -ry ../../../../../echo_pulse_macos_intel_v${{ env.VERSION }}+${{ env.BUILDVERSION }}.zip "EchoPulse.app"
          rm -rf "EchoPulse.app"



      - name: Upload Artifacts (macOS)
        uses: actions/upload-artifact@v5
        with:
          name: echo_pulse_macos
          path: |
            ECHOPULS/echo_pulse_macos_arm64_v${{ env.VERSION }}+${{ env.BUILDVERSION }}.dmg
            ECHOPULS/echo_pulse_macos_arm64_v${{ env.VERSION }}+${{ env.BUILDVERSION }}.zip
            ECHOPULS/echo_pulse_macos_intel_v${{ env.VERSION }}+${{ env.BUILDVERSION }}.dmg
            ECHOPULS/echo_pulse_macos_intel_v${{ env.VERSION }}+${{ env.BUILDVERSION }}.zip

      - name: Create Release (Apple)
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            ECHOPULS/echo_pulse_macos_arm64_v${{ env.VERSION }}+${{ env.BUILDVERSION }}.dmg
            ECHOPULS/echo_pulse_macos_arm64_v${{ env.VERSION }}+${{ env.BUILDVERSION }}.zip
            ECHOPULS/echo_pulse_macos_intel_v${{ env.VERSION }}+${{ env.BUILDVERSION }}.dmg
            ECHOPULS/echo_pulse_macos_intel_v${{ env.VERSION }}+${{ env.BUILDVERSION }}.zip
          tag: v${{ env.VERSION }}+${{ env.BUILDVERSION }}
          token: ${{ secrets.SECRET_KEY }}
          allowUpdates: true
          omitBody: true
          prerelease: false
