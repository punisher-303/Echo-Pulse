name: "Linux Build & Release"

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number'
        required: true
        default: '2111'

jobs:
  linux_build:
    name: Linux Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa liblzma-dev
          sudo apt-get install -y ninja-build libgtk-3-dev cmake git libmpv-dev clang libstdc++-12-dev

      - name: Clone Repository
        run: git clone -b SpotifyCanva https://${{secrets.SECRET_KEY}}@github.com/punisher-303/ECHOPULS.git

      - name: Install Dependencies
        run: cd ECHOPULS && flutter pub get

      - name: Extract version from pubspec.yaml
        run: |
          ver=$(grep -m1 -E '^version:\s*' ECHOPULS/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ -z "$ver" ]; then echo "version not found in pubspec.yaml"; exit 1; fi
          echo "VERSION=$ver" >> $GITHUB_ENV
      
      - name: Set build number
        run: |
          BUILD_NUM="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then BUILD_NUM="2111"; fi
          echo "BUILDVERSION=$BUILD_NUM" >> $GITHUB_ENV

      - name: Build Linux App
        env:
          SP_DC_SECRET: ${{ secrets.SP_DC_COOKIE }}
        run: cd ECHOPULS && flutter build linux --dart-define=SP_DC_COOKIE="$SP_DC_SECRET" --release --build-number $BUILDVERSION

      - name: Tar Linux App
        run: |
          cd ECHOPULS/build/linux/x64/release/bundle
          tar -czf ../echo_pulse_linux_v${{ env.VERSION }}+${{ env.BUILDVERSION }}.tar.gz .

      - name: Upload Artifacts (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: echo_pulse_linux
          path: ECHOPULS/build/linux/x64/release/echo_pulse_linux_v${{ env.VERSION }}+${{ env.BUILDVERSION }}.tar.gz

      - name: Create Release (Linux)
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            ECHOPULS/build/linux/x64/release/echo_pulse_linux_v${{ env.VERSION }}+${{ env.BUILDVERSION }}.tar.gz
          tag: v${{ env.VERSION }}+${{ env.BUILDVERSION }}
          token: ${{secrets.SECRET_KEY}}
          allowUpdates: true
          omitBody: true
          prerelease: true
